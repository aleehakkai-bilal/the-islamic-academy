name: Build The Islamic Academy APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        run: |
          mkdir -p app_source
          unzip -q the_islamic_academy_mobile_ready.zip -d app_source

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(dirname "$(find app_source -name pubspec.yaml -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: pubspec.yaml was not found inside the ZIP file."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found at: $PROJECT_DIR"

      - name: Get Flutter packages
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Check Flutter project
        run: |
          cd "$PROJECT_DIR"
          flutter analyze
        continue-on-error: true

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-islamic-academy-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
